name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Build per-platform bundles and, on tag push, attach them to a GitHub Release.
#
# The bundle is a THIN, stdlib-only PyInstaller launcher (the bootstrap) plus
# the add-on's own wheel under wheels/. It is a few MB — the heavy torch/CUDA
# stack is NOT frozen; the bootstrap pip-installs it into a private cache venv
# on first use (see musetalk_addon/_bootstrap.py). This is what lets MuseTalk
# ship on Linux at all: a fully frozen CUDA torch bundle is > 2 GiB, which
# GitHub refuses as a release asset.
#
# MuseTalk is CUDA-only, so only linux + windows are built (no macOS). The
# Subtitld catalog (https://subtitld.github.io/addons-catalog) picks the new
# release up from the org's releases.

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform_label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform_label: linux-x86_64
          - os: windows-2022
            platform_label: windows-x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        shell: bash
        run: |
          # Only the build tooling — NOT the torch/ML runtime deps. The heavy
          # stack is provisioned at the user's machine on first run, never
          # frozen here.
          python -m pip install --upgrade pip
          # Quote the specifier — unquoted, bash reads `>=6.0` as a redirection.
          python -m pip install build 'pyinstaller>=6.0'

      - name: Build the add-on wheel
        shell: bash
        run: |
          rm -rf dist
          python -m build --wheel
          ls -lah dist

      - name: Build PyInstaller bootstrap bundle
        shell: bash
        run: |
          # Bundles dist/subtitld_addon_musetalk-*.whl under wheels/ (see spec).
          pyinstaller pyinstaller.spec --noconfirm

      - name: Stage release archive
        shell: bash
        run: |
          set -euo pipefail
          version=$(python -c "import json; print(json.load(open('manifest.json'))['version'])")
          rm -rf release-staging
          mkdir -p release-staging/musetalk-addon
          cp -r dist/musetalk-addon/. release-staging/musetalk-addon/
          # manifest.json / LICENSE / README at the archive ROOT — where
          # Subtitld's installer reads manifest.json from.
          cp manifest.json LICENSE README.md release-staging/
          archive_name="musetalk-${version}-${{ matrix.platform_label }}.zip"
          ( cd release-staging && \
            python -c "import shutil,sys; shutil.make_archive(sys.argv[1], 'zip', '.')" "../${archive_name%.zip}" )
          ls -lah "$archive_name"
          echo "ARCHIVE_NAME=$archive_name" >> "$GITHUB_ENV"

      - name: Compute checksum
        shell: bash
        run: |
          python -c "import hashlib; print(hashlib.sha256(open('${ARCHIVE_NAME}','rb').read()).hexdigest())" \
            > "${ARCHIVE_NAME}.sha256"
          cat "${ARCHIVE_NAME}.sha256"

      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform_label }}
          path: |
            ${{ env.ARCHIVE_NAME }}
            ${{ env.ARCHIVE_NAME }}.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Fetch all built artefacts
        uses: actions/download-artifact@v4
        with:
          path: artefacts

      - name: Flatten layout
        shell: bash
        run: |
          mkdir -p release-files
          find artefacts -type f -name 'musetalk-*' -print -exec cp {} release-files/ \;
          ls -lah release-files

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          generate_release_notes: true
          fail_on_unmatched_files: true
